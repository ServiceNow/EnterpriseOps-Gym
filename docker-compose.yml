version: '3.8'

services:
  csm-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-csm:latest
    ports: ["8001:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  teams-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-teams:latest
    ports: ["8002:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  calendar-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-calendar:latest
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  email-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-email:latest
    ports: ["8004:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  itsm-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-itsm:latest
    ports: ["8006:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  hr-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-hr:latest
    ports: ["8008:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  drive-server:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-drive:latest
    ports: ["8009:8005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  evaluator:
    image: python:3.11-slim
    network_mode: host
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - venv-cache:/app/.venv
    working_dir: /app
    depends_on:
      csm-server:      {condition: service_healthy}
      teams-server:    {condition: service_healthy}
      calendar-server: {condition: service_healthy}
      email-server:    {condition: service_healthy}
      itsm-server:     {condition: service_healthy}
      hr-server:       {condition: service_healthy}
      drive-server:    {condition: service_healthy}
    command:
      - bash
      - -c
      - |
        set -e
        echo "1/3: Installing system dependencies..."
        apt-get update -qq && apt-get install -y -qq unzip curl git
        
        echo "2/3: Installing uv..."
        curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
        
        echo "3/3: Syncing Python dependencies..."
        uv sync --extra all
        
        if [ ! -f gym_dbs.zip ]; then
          echo "ERROR: gym_dbs.zip not found. Download it from the repo root before running."
          exit 1
        fi
        unzip -n gym_dbs.zip
        
        echo "Ready! The container is idling in the background."
        tail -f /dev/null

volumes:
  uv-cache:
  venv-cache:
